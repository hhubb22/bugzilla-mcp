services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: bugs
      MARIADB_USER: bugs
      MARIADB_PASSWORD: bugs_test_pass
      MARIADB_ROOT_PASSWORD: root_test_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --innodb-ft-min-token-size=2
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20

  bugzilla:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/rest/version"]
      interval: 5s
      timeout: 5s
      retries: 30
