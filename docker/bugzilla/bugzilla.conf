<VirtualHost *:80>
    ServerAdmin admin@bugzilla.local
    DocumentRoot /var/www/bugzilla

    SetEnv PERL5LIB /app/local/lib/perl5

    <Directory /var/www/bugzilla>
        CGIPassAuth On
        AddHandler cgi-script .cgi
        Options +ExecCGI +FollowSymLinks
        DirectoryIndex index.cgi index.html
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^rest/(.*)$ rest.cgi/$1 [NE,L]
    </Directory>

    # Zero-query-string log format: %U logs path only, never query parameters (SEC-01)
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" noquery
    ErrorLog /dev/stderr
    CustomLog /dev/stdout noquery
</VirtualHost>
